@if (!identifier) {
  <p class="text-gray-500 italic">Select a patient to build a bundle</p>
} @else {
  <div class="mb-3">
    <button mat-raised-button color="primary" (click)="buildBundle()" [disabled]="!canBuild">
      {{ loading ? 'Building...' : 'Build Bundle' }}
    </button>
    @if ((observationCount ?? 0) === 0) {
      <p class="text-xs text-gray-500 mt-1">Generate observations first</p>
    }
  </div>

  @if (errorMessage) {
    <p class="mb-2 text-red-600">{{ errorMessage }}</p>
  }

  @if (bundleType) {
    <div class="mb-2 flex items-center gap-2">
      <mat-chip-set>
        <mat-chip [class]="bundleType === 'transaction' ? 'bg-purple-100 text-purple-800' : 'bg-teal-100 text-teal-800'">
          {{ bundleType | titlecase }}
        </mat-chip>
      </mat-chip-set>
      <span class="text-sm font-medium">{{ entryCount }} entries</span>
    </div>

    <p class="text-sm text-gray-600 mb-3">{{ bundleTypeReason }}</p>

    <app-json-viewer [jsonData]="bundleJson"></app-json-viewer>

    <div class="mt-3">
      <button mat-raised-button color="accent" (click)="postBundle()" [disabled]="!canPost">
        @if (posting) {
          <mat-spinner diameter="18" class="inline-block mr-1"></mat-spinner>
          Posting...
        } @else {
          Post Bundle
        }
      </button>
    </div>
  }
}
