@if (!identifier) {
  <p class="text-gray-500 italic">Select a patient to view details</p>
} @else {
  @if (fhirId) {
    <p class="mb-2 text-sm font-semibold text-indigo-700">FHIR ID: {{ fhirId }}</p>
  }

  <app-json-viewer [jsonData]="patientResource"></app-json-viewer>

  <div class="mt-3">
    <button mat-raised-button color="primary" (click)="postPatient()" [disabled]="posting">
      {{ posting ? 'Posting...' : 'Post Patient' }}
    </button>
  </div>

  @if (successMessage) {
    <p class="mt-2 text-green-700 font-medium">{{ successMessage }}</p>
  }
  @if (errorMessage) {
    <p class="mt-2 text-red-600">{{ errorMessage }}</p>
  }
}
